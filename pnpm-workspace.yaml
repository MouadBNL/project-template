packages:
  - apps/*
  - packages/*
  - tools/*
  - e2e

# Every dependency version is declared exactly once, here. package.json files
# reference it with "catalog:". `strict` makes pnpm reject anything else.
catalogMode: strict

catalog:
  "@babel/core": ^7.28.0
  "@orpc/client": ^1.16.2
  "@orpc/contract": ^1.16.2
  "@orpc/server": ^1.16.2
  "@rolldown/plugin-babel": ^0.3.1
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/react-query": ^5.107.1
  "@tanstack/react-router": ^1.170.46
  "@tanstack/router-cli": ^1.168.0
  "@tanstack/router-plugin": ^1.169.0
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  babel-plugin-react-compiler: ^1.0.0
  hono: ^4.13.17
  "@hono/node-server": ^2.1.6
  "@electric-sql/pglite": ^0.5.14
  "@types/pg": ^8.23.1
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  pg: ^8.23.1
  knip: ^6.44.2
  # Copy-paste detector (Rust binary), `pnpm duplicates`; config in .jscpd.json.
  jscpd: 5.4.2
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.5
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  zod: ^4.6.7
  # Frontend: design system (packages/ui) and web app.
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/inter": ^5.3.0
  lucide-react: ^1.70.0
  tailwind-variants: ^4.0.1
  # Frontend tests (DOM emulation, see docs/testing.md).
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  happy-dom: ^21.0.4
  # End-to-end browser suite (e2e/, `pnpm e2e`; docs/testing.md).
  "@playwright/test": 1.64.1

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Vite+ manages the Node.js and pnpm versions (see .node-version and
# package.json#packageManager); stop pnpm from switching them on its own.
runtimeOnFail: ignore
pmOnFail: ignore

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.5.1"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.5.1"
  - "@voidzero-dev/vite-plus-darwin-x64@1.5.1"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.1"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.5.1"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.5.1"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.5.1"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.1"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.5.1"
  - vite-plus@1.5.1
