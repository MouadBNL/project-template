# The same commands as locally (AGENTS.md): `pnpm check`, then the browser suite `pnpm e2e`.
# Node and pnpm come from .node-version and package.json#packageManager through setup-vp.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # Vite+ task results (docs: node_modules/vite-plus/docs/guide/github-actions-cache.md).
      # Restored after install; Vite+ itself decides which tasks still hit.
      - name: Restore Vite+ task cache
        id: task-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm check

      - name: Save Vite+ task cache
        if: success()
        uses: actions/cache/save@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  e2e:
    name: pnpm e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Playwright version
        id: playwright
        working-directory: e2e
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e
        run: pnpm exec playwright install-deps chromium

      - run: pnpm e2e

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
